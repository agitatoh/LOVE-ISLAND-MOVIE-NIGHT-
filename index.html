<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏝️ A Very Important Text 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hearts"></div>

<div class="sticker sticker1">💖</div>
<div class="sticker sticker2">🌴</div>
<div class="sticker sticker3">✨</div>
<div class="sticker sticker4">💕</div>
<div class="sticker sticker5">📱</div>
<div class="sticker sticker6">🏝️</div>


<div class="card" id="card">

    <div class="tape"></div>

    <h1>🏝️ Love Island USA Finale 💖</h1>

    <p id="subtitle">
        📱 I GOT A TEXT!<br><br>

        Since airport Wi-Fi is always a gamble...
        <br>
        I made sure the villa could come with you. 💕

        <br><br>

        Your very important finale delivery has arrived.
    </p>


    <button id="startBtn">
        💌 Open the villa
    </button>


    <div id="player" class="hidden">

        <video id="video" controls playsinline>
            <source src="movie.mp4" type="video/mp4">
        </video>

    </div>


    <div class="signature">
        xoxo, your unofficial villa producer 🌴
    </div>


</div>


<script src="script.js"></script>

</body>
</html>
